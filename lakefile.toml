name = "FloatLib"
defaultTargets = ["FloatLib"]
testDriver = "FloatTest"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.23.0-rc2"


[[lean_lib]]
name = "FloatLib"

[[lean_lib]]
name = "FloatTest"
globs = ["test.+"]  
leanOptions = {linter.unusedVariables = false}
